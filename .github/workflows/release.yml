name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preflight

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux-amd64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            label: linux-arm64
            cross: true

          - target: aarch64-apple-darwin
            os: macos-14
            label: darwin-arm64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.cross
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build nonla-tunnel client
        run: |
          cargo build --release --target ${{ matrix.target }} --bin nonla-tunnel

      - name: Package binary
        run: |
          TAG="${GITHUB_REF_NAME}"
          BIN="target/${{ matrix.target }}/release/nonla-tunnel"
          TAR="nonla-tunnel-${TAG}-${{ matrix.label }}.tar.gz"
          tar -czf "$TAR" -C "target/${{ matrix.target }}/release" nonla-tunnel
          cp "$BIN" "nonla-tunnel-${{ matrix.label }}"
          echo "📦 $TAR ($(du -h "$TAR" | cut -f1))"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.label }}
          path: |
            *.tar.gz
            nonla-tunnel-${{ matrix.label }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz nonla-tunnel-* > SHA256SUMS.txt || sha256sum *.tar.gz > SHA256SUMS.txt

      - name: List release files
        run: ls -lh dist/

      - name: Version without "v" (image tag)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## Deploy server

            No need to clone or build from source:

            ```bash
            mkdir -p nonla-tunnel && cd nonla-tunnel
            curl -fsSL -o docker-compose.yml \
              https://raw.githubusercontent.com/devnonla/nonla-tunnel/${{ github.ref_name }}/docker-compose.yml
            curl -fsSL -o .env.example \
              https://raw.githubusercontent.com/devnonla/nonla-tunnel/${{ github.ref_name }}/.env.example
            cp .env.example .env
            # edit .env: DOMAIN, AUTH_TOKEN, TRAEFIK_DYNAMIC_DIR (IMAGE_TAG=latest or a version)
            docker compose pull
            docker compose up -d
            ```

            Image: `ghcr.io/devnonla/nonla-tunnel:${{ env.VERSION }}` (also `:latest`)

            ## Install client

            Prefer the one-liner from your server:

            ```bash
            curl -sSL https://YOUR_DOMAIN/install | bash
            # invite from: nonla-tunnel-server invite --label my-agent
            nonla-tunnel enroll --server connect.YOUR_DOMAIN --invite nti_...
            nonla-tunnel http 3000
            ```
