name: Build Main

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push images to ghcr.io with GITHUB_TOKEN

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE_NAME: nonla-tunnel

jobs:
  binaries:
    name: Binary ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-24.04,     label: linux-amd64,   ext: "",     musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, label: linux-arm64,   ext: "",     musl: true }
          - { target: aarch64-apple-darwin,       os: macos-latest,     label: darwin-arm64,  ext: "" }
          - { target: x86_64-apple-darwin,        os: macos-latest,     label: darwin-amd64,  ext: "",     cross: true }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   label: windows-amd64, ext: ".exe" }
          - { target: aarch64-pc-windows-msvc,    os: windows-11-arm,   label: windows-arm64, ext: ".exe" }

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Static musl binaries run on any Linux (glibc distros, Alpine, scratch).
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      # ring needs clang for aarch64 Windows.
      - name: Ensure clang (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Build nonla-tunnel
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin nonla-tunnel

      - name: Package
        shell: bash
        run: |
          OUT="nonla-tunnel-${{ matrix.label }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/nonla-tunnel${{ matrix.ext }}" "$OUT"
          ls -l "$OUT"

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: ./nonla-tunnel-${{ matrix.label }}${{ matrix.ext }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.label }}
          path: nonla-tunnel-${{ matrix.label }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # GHCR image names must be lowercase.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker merge
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE_REF="${{ env.IMAGE }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_REF}@sha256:%s " *)
