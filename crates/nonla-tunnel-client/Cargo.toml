[package]
name = "nonla-tunnel-client"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nonla Tunnel client CLI (nonla-tunnel) — expose local HTTP apps"

[[bin]]
name = "nonla-tunnel"
path = "src/main.rs"

[dependencies]
nonla-tunnel-protocol = { path = "../nonla-tunnel-protocol" }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
yamux = { workspace = true }
futures = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
getrandom = "0.2"
socket2 = { workspace = true }
serde_json = { workspace = true }
# HTTPS for `upgrade` (rustls + webpki roots, same TLS stack as the tunnel).
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
