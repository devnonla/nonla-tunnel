services:
  nonla-tunnel:
    image: ${DOCKER_IMAGE:-ghcr.io/devnonla/nonla-tunnel}:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      NONLA_DOMAIN: ${DOMAIN}
      NONLA_TOKEN: ${AUTH_TOKEN:-}
      RUST_LOG: info
    volumes:
      - nonla_config:/etc/nonla-tunnel
      - ${TRAEFIK_DYNAMIC_DIR}:/etc/traefik/dynamic

volumes:
  nonla_config:
