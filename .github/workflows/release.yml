name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preflight

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-24.04,     label: linux-amd64,   ext: "",     musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, label: linux-arm64,   ext: "",     musl: true }
          - { target: aarch64-apple-darwin,       os: macos-latest,     label: darwin-arm64,  ext: "" }
          - { target: x86_64-apple-darwin,        os: macos-latest,     label: darwin-amd64,  ext: "",     cross: true }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   label: windows-amd64, ext: ".exe" }
          - { target: aarch64-pc-windows-msvc,    os: windows-11-arm,   label: windows-arm64, ext: ".exe" }

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Static musl binaries run on any Linux (glibc distros, Alpine, scratch).
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      # ring needs clang for aarch64 Windows.
      - name: Ensure clang (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Build nonla-tunnel
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin nonla-tunnel

      - name: Package
        shell: bash
        run: |
          OUT="nonla-tunnel-${{ matrix.label }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/nonla-tunnel${{ matrix.ext }}" "$OUT"
          ls -l "$OUT"

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: ./nonla-tunnel-${{ matrix.label }}${{ matrix.ext }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.label }}
          path: nonla-tunnel-${{ matrix.label }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum nonla-tunnel-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: List release files
        run: ls -lh dist/

      - name: Version without "v" (image tag)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## Deploy server

            No need to clone or build from source:

            ```bash
            mkdir -p nonla-tunnel && cd nonla-tunnel
            curl -fsSL -o docker-compose.yml \
              https://raw.githubusercontent.com/devnonla/nonla-tunnel/${{ github.ref_name }}/docker-compose.yml
            curl -fsSL -o .env.example \
              https://raw.githubusercontent.com/devnonla/nonla-tunnel/${{ github.ref_name }}/.env.example
            cp .env.example .env
            # edit .env: DOMAIN, AUTH_TOKEN, TRAEFIK_DYNAMIC_DIR (IMAGE_TAG=latest or a version)
            docker compose pull
            docker compose up -d
            ```

            Image: `ghcr.io/devnonla/nonla-tunnel:${{ env.VERSION }}` (also `:latest`)

            ## Install the client

            Create an invite on the server (`nonla-tunnel-server invite --label my-agent`), then on the agent's machine:

            ```bash
            # Linux / macOS
            curl -fsSL https://YOUR_DOMAIN/install | sh -s -- --invite nti_...
            ```

            ```powershell
            # Windows
            $env:NONLA_INVITE='nti_...'; irm https://YOUR_DOMAIN/install.ps1 | iex
            ```

            Then `nonla-tunnel http 3000 --name my-app -d`.

            Claude Code: `/plugin marketplace add devnonla/nonla-tunnel` → `/plugin install nonla-tunnel@nonla-tunnel`.

            Binaries: Linux (static, amd64/arm64), macOS (Apple Silicon/Intel), Windows (amd64/arm64). Verify with `SHA256SUMS.txt`.
